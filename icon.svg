<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dégradé de fond radial sombre et cosmique -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e152a" />
      <stop offset="60%" stop-color="#0c0714" />
      <stop offset="100%" stop-color="#050209" />
    </radialGradient>

    <!-- Dégradé métallique pour le manche de sabre laser (Mod) -->
    <linearGradient id="metalHilt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="20%" stop-color="#475569" />
      <stop offset="40%" stop-color="#94a3b8" />
      <stop offset="55%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Dégradé doré de luxe pour les bagues d'accentuation -->
    <linearGradient id="metalGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Dégradé pour le e-liquide turquoise fluo -->
    <linearGradient id="eliquidGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.95" />
      <stop offset="80%" stop-color="#06b6d4" stop-opacity="0.90" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.80" />
    </linearGradient>

    <!-- Dégradés de vapeur colorés et translucides -->
    <linearGradient id="smokeCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="smokePink" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#db2777" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0" />
    </linearGradient>

    <!-- Dégradé pour les reflets du verre -->
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Filtres pour effets de lueur néon (Glow) -->
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowIntense" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Filtre de flou pour la vapeur réaliste -->
    <filter id="smokeBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <!-- Arrière-plan principal arrondi style Icône d'App -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)" stroke="#2e1065" stroke-width="4" />

  <!-- Liseré de lueur interne subtil pour l'icône -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#6366f1" stroke-width="2.5" opacity="0.25" />

  <!-- ================= VOLUTES DE VAPEUR (ARRIÈRE-PLAN BLUR) ================= -->
  <g filter="url(#smokeBlur)" opacity="0.75">
    <!-- Gros nuages de vapeur colorés et entrelacés -->
    <circle cx="190" cy="80" r="60" fill="url(#smokeCyan)" />
    <circle cx="322" cy="75" r="65" fill="url(#smokePink)" />
    <circle cx="256" cy="50" r="50" fill="#a78bfa" opacity="0.5" />
    <path d="M220 100 C140 80, 110 30, 210 20 C280 10, 320 40, 292 80 Z" fill="url(#smokeCyan)" />
    <path d="M292 100 C372 80, 402 30, 302 20 C242 10, 202 40, 220 80 Z" fill="url(#smokePink)" />
  </g>

  <!-- ================= ATOMISEUR / CLEAROMISEUR (MILIEU) ================= -->
  
  <!-- Base de connexion du réservoir (Bague inférieure dorée/métal) -->
  <rect x="180" y="276" width="152" height="14" rx="3" fill="url(#metalHilt)" stroke="#0f172a" stroke-width="2.5" />
  <rect x="180" y="280" width="152" height="4" fill="url(#metalGold)" />

  <!-- Cheminée interne / Résistance (Coil) -->
  <rect x="240" y="146" width="32" height="130" fill="url(#metalHilt)" stroke="#0f172a" stroke-width="1.5" />
  <!-- Stries hélicoïdales de la résistance du sabre laser -->
  <path d="M240 165 L272 173 M240 185 L272 193 M240 205 L272 213 M240 225 L272 233 M240 245 L272 253 M240 265 L272 273" stroke="#0f172a" stroke-width="3.5" opacity="0.6" />

  <!-- E-LIQUIDE TURQUOISE NEON -->
  <!-- Rempli à 75% dans le réservoir -->
  <rect x="199" y="178" width="114" height="98" rx="6" fill="url(#eliquidGradient)" />
  
  <!-- Ligne de ménisque brillante de l'e-liquide -->
  <path d="M199 178 Q256 183 313 178" stroke="#22d3ee" stroke-width="4.5" fill="none" filter="url(#glowCyan)" />

  <!-- Micro-bulles d'air flottantes dans le e-liquide -->
  <circle cx="215" cy="245" r="4" fill="#ffffff" opacity="0.6" />
  <circle cx="225" cy="210" r="2.5" fill="#ffffff" opacity="0.4" />
  <circle cx="295" cy="235" r="3.5" fill="#ffffff" opacity="0.5" />
  <circle cx="282" cy="195" r="5" fill="#ffffff" opacity="0.7" />
  <circle cx="245" cy="255" r="2.5" fill="#ffffff" opacity="0.5" />
  <circle cx="265" cy="220" r="3.5" fill="#ffffff" opacity="0.6" />

  <!-- Tube en Verre Pyrex Extérieur (Transparent) -->
  <rect x="196" y="146" width="120" height="130" rx="14" fill="none" stroke="#64748b" stroke-width="4" opacity="0.6" />
  <rect x="196" y="146" width="120" height="130" rx="14" fill="none" stroke="#cbd5e1" stroke-width="1.5" opacity="0.9" />

  <!-- Reflets lumineux réalistes sur le verre -->
  <rect x="202" y="152" width="12" height="118" rx="3" fill="url(#glassReflection)" />
  <rect x="302" y="152" width="6" height="118" rx="1.5" fill="url(#glassReflection)" opacity="0.6" />

  <!-- Top Cap (Bague supérieure dorée/métal) -->
  <rect x="180" y="132" width="152" height="14" rx="3" fill="url(#metalHilt)" stroke="#0f172a" stroke-width="2.5" />
  <rect x="180" y="136" width="152" height="4" fill="url(#metalGold)" />

  <!-- DRIP TIP (Embout buccal style sabre laser) -->
  <rect x="232" y="96" width="48" height="36" rx="6" fill="#0f172a" stroke="url(#metalHilt)" stroke-width="2.5" />
  <!-- Ouverture du Drip Tip avec effet néon intense de chauffe -->
  <ellipse cx="256" cy="96" rx="16" ry="5" fill="#06b6d4" filter="url(#glowCyan)" />

  <!-- ================= MANCHE DE SABRE / MOD DE VAPE (BAS) ================= -->
  
  <!-- Corps principal du Mod (Métal) -->
  <rect x="196" y="290" width="120" height="166" rx="20" fill="url(#metalHilt)" stroke="#0f172a" stroke-width="3" />

  <!-- Insert central en carbone/noir pour le grip -->
  <rect x="204" y="300" width="104" height="146" rx="14" fill="#0f172a" />

  <!-- Stries horizontales ergonomiques style Sabre Laser -->
  <rect x="204" y="312" width="104" height="6" fill="url(#metalHilt)" opacity="0.8" />
  <rect x="204" y="326" width="104" height="6" fill="url(#metalHilt)" opacity="0.8" />

  <!-- Écran OLED High-Tech -->
  <rect x="216" y="342" width="80" height="46" rx="6" fill="#020617" stroke="#334155" stroke-width="2" />
  <!-- Indicateur de batterie néon épuré -->
  <rect x="236" y="357" width="40" height="16" rx="3" fill="none" stroke="#22d3ee" stroke-width="2" filter="url(#glowCyan)" />
  <rect x="276" y="362" width="3" height="6" rx="1" fill="#22d3ee" filter="url(#glowCyan)" />
  <rect x="241" y="361" width="7" height="8" rx="1" fill="#22d3ee" />
  <rect x="250" y="361" width="7" height="8" rx="1" fill="#22d3ee" />
  <rect x="259" y="361" width="7" height="8" rx="1" fill="#22d3ee" />

  <!-- BOUTON D'ACTIVATION (Circular Fire Button - Sabre Activator) -->
  <!-- Anneau de lueur néon cyan -->
  <circle cx="256" cy="414" r="16" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#glowCyan)" />
  <!-- Bouton métallique intérieur -->
  <circle cx="256" cy="414" r="12" fill="url(#metalHilt)" stroke="#0f172a" stroke-width="1.5" />
  <!-- Point central LED brillant -->
  <circle cx="256" cy="414" r="6" fill="#22d3ee" />

  <!-- Pommel inférieur (Base du sabre) -->
  <rect x="210" y="456" width="92" height="16" rx="4" fill="url(#metalHilt)" stroke="#0f172a" stroke-width="2.5" />
  <rect x="210" y="460" width="92" height="4" fill="url(#metalGold)" />

  <!-- Crochet en D (D-Ring) décoratif au bas du sabre -->
  <path d="M246 472 C246 482, 266 482, 266 472" stroke="#475569" stroke-width="3" fill="none" stroke-linecap="round" />
</svg>